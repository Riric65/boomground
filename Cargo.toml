[package]
name = "boomground"
version = "1.5.5"
edition = "2021"
description = "Destruction de voxels en bac à sable ou en mode boutique."
license-file = "LICENSE"
publish = false

[[bin]]
name = "boomground"
path = "src/main.rs"

[dependencies]
# "wav" : les bruitages sont synthétisés à la volée puis encodés en WAV, ce qui
# évite d'embarquer des fichiers audio.
bevy = { version = "0.20", features = ["wav", "vorbis"] }
# Heure locale de la machine pour le journal du serveur.
# Voix de proximité : capture / lecture audio et suppression de bruit.
cpal = "0.17"
nnnoiseless = { version = "0.5", default-features = false }
# Discord Rich Presence (IPC local, aucun compte requis).
discord-rich-presence = "0.2"
# Icône de la fenêtre.
winit = { version = "0.30", default-features = false }
# Console du serveur (saisie qui reste en bas pendant que le journal défile).
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Bevy est long à compiler en debug : on optimise les dépendances pour que le
# jeu reste fluide, sans debuginfo sur elles (économie de mémoire au build).
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

# Version distribuée : rapide et compacte.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

# Android : Bevy n'active aucune activité par défaut ; l'APK utilise la
# `NativeActivity` du système (pas de dépendance Java supplémentaire).
[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.20", features = ["android-native-activity"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# APK : on vise la taille (téléchargement, mémoire du téléphone) plutôt que
# les derniers pourcents de vitesse.
[profile.android]
inherits = "release"
opt-level = "s"
# LTO « thin » : le « fat » dépasse la mémoire d'une machine modeste.
lto = "thin"
