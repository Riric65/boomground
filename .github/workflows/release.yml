# Construit le jeu pour Windows (BoomGround-Setup.exe), Linux
# (BoomGround-x86_64.AppImage) et Android (BoomGround.apk).
#
# - À chaque push / pull request : les trois versions sont compilées et
#   téléchargeables dans l'onglet « Actions » (artefacts).
# - Sur un tag `v*` (ex. `git tag v1.0.0 && git push --tags`) : une release
#   GitHub est créée avec les fichiers en pièces jointes.
name: release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File scripts/package.ps1
          - os: ubuntu-22.04
            script: sh scripts/package-appimage.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Fichier à distribuer
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-${{ runner.os }}
          path: dist/*

  # APK Android (utilisable aussi sur GrapheneOS, qui est un Android sans
  # Google Play). Isolé du job bureau : le SDK/NDK Android n'y sert à rien et
  # allongerait la compilation de tous les autres.
  android:
    name: APK Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: NDK et SDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Rust (cible Android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Construire l'APK
        working-directory: android
        run: |
          gradle --no-daemon assembleRelease
          cp build/outputs/apk/release/*.apk BoomGround.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-Android
          path: android/BoomGround.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
