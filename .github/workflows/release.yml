# Construit le jeu pour Windows (BoomGround-Setup.exe) et Linux
# (BoomGround-x86_64.AppImage).
#
# - À chaque push / pull request : les deux versions sont compilées et
#   téléchargeables dans l'onglet « Actions » (artefacts).
# - Sur un tag `v*` (ex. `git tag v1.0.0 && git push --tags`) : une release
#   GitHub est créée avec les fichiers en pièces jointes.
name: release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File scripts/package.ps1
          - os: ubuntu-22.04
            script: sh scripts/package-appimage.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Fichier à distribuer
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: BoomGround-${{ runner.os }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
