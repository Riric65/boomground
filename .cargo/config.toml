# Limiter les rustc concurrents évite les OOM (SIGKILL) au build sur les
# machines avec peu de RAM.
[build]
jobs = 6

# Windows : runtime C intégré à l'exécutable (pas besoin d'installer
# « Visual C++ Redistributable » chez le joueur).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
